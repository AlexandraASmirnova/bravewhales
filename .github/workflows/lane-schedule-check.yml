name: Lane schedule check

on:
  schedule:
    # 13:00 UTC = 5:00am PST / 6:00am PDT -- within half an hour of 5:30am
    # Pacific either way, with a single cron entry (see note below on why
    # not two). GitHub Actions scheduled runs are also "best effort" and
    # can be delayed by hours, especially for low-traffic repos -- the
    # script runs unconditionally whenever this actually fires rather than
    # checking the clock, so a delayed run still checks instead of silently
    # doing nothing.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      check_date:
        description: "Date to check (YYYY-MM-DD). Leave blank for today."
        required: false

permissions:
  contents: write  # needed to commit history.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r lane-schedule-monitor/requirements.txt

      - name: Run lane schedule check
        env:
          # Optional overrides -- the script already has working defaults
          # (the same Web3Forms key this repo's contact form uses).
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          CHECK_DATE: ${{ github.event.inputs.check_date }}
        run: python lane-schedule-monitor/check_schedule.py

      - name: Commit updated history
        run: |
          if ! git diff --quiet -- lane-schedule-monitor/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lane-schedule-monitor/history.json
            git commit -m "Update schedule check history [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi
